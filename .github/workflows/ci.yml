name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas del motor
        run: npm test
      - name: Construir el archivo único
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: maquina-turing-html
          path: dist/maquina-turing.html
